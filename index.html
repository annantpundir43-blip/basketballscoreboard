<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>

    <div class="scoreboard">

        <div class="team">
            <h1>HOME</h1>

            <div class="score" id="home-score">0</div>

            <div class="buttons">
                <button onclick="addPoints('home', 1)">+1</button>
                <button onclick="addPoints('home', 2)">+2</button>
                <button onclick="addPoints('home', 3)">+3</button>
            </div>
        </div>

        <div class="team">
            <h1>AWAY</h1>

            <div class="score" id="away-score">0</div>

            <div class="buttons">
                <button onclick="addPoints('away', 1)">+1</button>
                <button onclick="addPoints('away', 2)">+2</button>
                <button onclick="addPoints('away', 3)">+3</button>
            </div>
        </div>
       

    </div>

    <script src="script.js"></script>

</body>
</html>




<body>
    <div class="container">

        <div class="scoreboard">
            <!-- Home and Away teams -->
        </div>

        <button class="reset-btn" onclick="resetScores()">
            Reset Score
        </button>

    </div>

    <script src="script.js"></script>
</body>
